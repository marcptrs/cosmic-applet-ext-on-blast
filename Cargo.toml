[package]
name = "cosmic-ext-applet-on-blast"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "On Blast applet for COSMIC Desktop — inline panel art, label, and controls"

[build-dependencies]
vergen = { version = "8", features = ["git", "gitcl"] }

[dependencies]
cosmic-config = { git = "https://github.com/pop-os/libcosmic.git" }
dbus = "0.9"
i18n-embed-fl = "0.9"
# Only the image formats album art actually ships as; the default feature set
# compiles in a dozen decoders (tiff, exr, dds, …) we never touch.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
mpris = "2"
reqwest = { version = "0.12", features = ["default-tls"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
# spawn_blocking + tokio::fs is all we use directly; the rest of the runtime is
# pulled in (with a superset of features) by libcosmic and reqwest anyway.
tokio = { version = "1", features = ["rt-multi-thread", "fs"] }

[dependencies.i18n-embed]
version = "0.15"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = [
    "applet",   # pulls in autosize, winit, wayland, tokio
    "dbus-config",
]

